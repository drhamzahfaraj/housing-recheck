<title>المراجعة الثانية — عبدالعزيز دخيل الشعلان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --line:#dfe4e0; --ink:#17211d; --muted:#63706a;
  --brand:#22B24C; --brand-d:#16A34A;
  --red:#b91c1c; --red-soft:#fbe6e6; --amber:#b45309;
  --green:#15803d; --green-soft:#e4f4e8;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 20px rgba(20,40,35,.07);
  --safe-r:env(safe-area-inset-right,0px); --safe-l:env(safe-area-inset-left,0px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding:14px calc(12px + var(--safe-r)) calc(90px + var(--safe-b)) calc(12px + var(--safe-l))}

header.app{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 6px 18px rgba(20,40,35,.14);overflow:hidden;position:sticky;top:0;z-index:30}
header.app::after{content:"";position:absolute;left:-40px;top:-40px;width:170px;height:170px;background:rgba(255,255,255,.09);border-radius:50%}
.rev{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.rev .dot{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rev .led{width:10px;height:10px;border-radius:50%;background:var(--red);transition:background .25s}
.rev .led.ok{background:var(--green)}
.rev .pending{font-size:10.5px;color:var(--red);font-weight:700;margin-inline-start:6px}
.rev .who{font-weight:800;font-size:15px}
header.app h1{margin:8px 0 0;font-size:19px;font-weight:800;letter-spacing:-.3px}
header.app p{margin:5px 0 0;opacity:.92;font-size:12.5px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px;position:relative;z-index:1}
.metric{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 8px;text-align:center}
.metric b{display:block;font-size:23px;font-weight:800;line-height:1.1}
.metric span{font-size:11px;opacity:.92}
.progress{margin-top:13px;position:relative;z-index:1}
.progress .bar{height:10px;background:rgba(255,255,255,.24);border-radius:999px;overflow:hidden}
.progress .fill{height:100%;background:#fff;border-radius:999px;transition:width .4s ease}
.progress .lbl{font-size:12px;opacity:.94;margin-top:6px}


.controls{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:9px}
.controls .grp{display:flex;flex-direction:column;gap:3px;min-width:0}
.controls .grp.wide{grid-column:1 / -1}
.controls label{font-size:11px;color:var(--muted);font-weight:700;padding-inline-start:2px}
.controls select,.controls input[type=search]{font-family:inherit;font-size:16px;border:1px solid var(--line);background:#fafbfa;border-radius:11px;padding:11px 12px;color:var(--ink);width:100%;min-height:46px}
.exportrow{display:flex;gap:9px;grid-column:1 / -1}
.exportrow .btn{flex:1}
.btn{font-family:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:#fafbfa;color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.12s;min-height:46px}
.btn:active{transform:scale(.97);background:#eceeec}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:active{background:var(--brand-d)}

.roomlist{display:grid;gap:11px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card .top{display:flex;align-items:center;gap:11px;padding:14px;cursor:pointer;min-height:60px}
.card .top:active{background:#f6f7f6}
.chip-code{background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 10px;border-radius:9px;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.card .meta{flex:1;min-width:0}
.card .meta .line1{font-weight:700;font-size:14.5px}
.card .meta .line2{font-size:12.5px;color:#4a5551;margin-top:3px;font-weight:500;line-height:1.5}
.state{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.state.ready{background:var(--green-soft);color:var(--green)}
.state.notready{background:var(--red-soft);color:var(--red)}
.state.partial{background:#fdf0dd;color:#b45309}
.mini.info{background:#eef1ee;color:#63706a}
.tasksec.maint-info{background:#fbf8f2;border-color:#ecdfc9}
.mchips{display:flex;flex-wrap:wrap;gap:7px}
.mchip{font-size:13px;font-weight:600;background:#fff;border:1px solid #ecdfc9;color:#8a6d3b;border-radius:999px;padding:8px 12px}
.maint-note{font-size:11.5px;color:#8a6d3b;margin-top:9px;line-height:1.5}
.caret{color:var(--muted);font-size:12px;transition:.2s;flex-shrink:0}
.card.open .caret{transform:rotate(180deg)}
.card .synced{font-size:15px;color:var(--green);flex-shrink:0}

.detail{display:none;border-top:1px solid var(--line);padding:14px;background:#fbfcfb}
.card.open .detail{display:block}
.reasonbox{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.reasonbox b{color:var(--ink)}
.reasonbox.ready{color:#15803D;background:#EAF3EA;padding:9px 12px;border-radius:9px;font-weight:600}
.reasonbox.await{color:#B45309;background:#FCF1E3;padding:9px 12px;border-radius:9px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px 11px}
.tasksec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:13px}
.tasksec .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tasksec .sechead h4{margin:0;font-size:13px;font-weight:800;color:var(--muted)}
.mini{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.mini.all{background:var(--green-soft);color:var(--green)}
.taskgrid{display:grid;grid-template-columns:1fr;gap:8px}
.task{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:11px;padding:13px 12px;cursor:pointer;font-size:15.5px;font-weight:500;background:#fafbfa;transition:.12s;user-select:none;min-height:50px}
.task:active{transform:scale(.99)}
.task.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.task .box{width:24px;height:24px;border-radius:7px;border:2px solid #c2ccc7;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:#fff;background:#fff;transition:.12s}
.task.done .box{background:var(--green);border-color:var(--green)}
.task .ico{font-size:17px}
.task .lbl{flex:1}
.none-req{font-size:13px;color:#9aa5a0;padding:2px}
.occ-row{display:flex;gap:8px}
.occ-btn{flex:1;border:1.5px solid var(--line);background:#fafbfa;border-radius:11px;padding:12px 6px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);min-height:50px;transition:.12s}
.occ-btn:active{transform:scale(.98)}
.occ-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.occ-chip{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef1ee;color:#63706a;white-space:nowrap;flex-shrink:0}
.occ-chip.student{background:#e4f4e8;color:#15803d}.occ-chip.worker{background:#fdf0dd;color:#b45309}.occ-chip.empty{background:#eef0f2;color:#6b7280}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field textarea,.field input{width:100%;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);resize:vertical}
.field textarea{min-height:60px}
.saverow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saverow .btn.primary{flex:1;min-width:160px}
.saved-tag{font-size:12px;color:var(--green);font-weight:700}
.empty-list{text-align:center;padding:44px 20px;color:var(--muted)}
footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:13px;font-weight:700;font-size:15px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1}

@media(min-width:641px){
  .metrics{gap:12px} .metric b{font-size:26px}
  .controls{grid-template-columns:repeat(2,1fr)}
  .taskgrid{grid-template-columns:repeat(2,1fr)}
  .card .top{min-height:auto}
}
</style>
</head>

// ---- derived status ----
function furnTotal(r){ return r.furnItems?r.furnItems.length:0; }
function furnDoneCount(r){ const rc=rec(r.id)||{}; let d=0; (r.furnItems||[]).forEach(it=>{ if(rc.furn&&rc.furn[it]) d++; }); return d; }
function furnitureDone(r){ const t=furnTotal(r); return t===0 || furnDoneCount(r)===t; }
function maintTotal(r){ return r.maintItems?r.maintItems.length:0; }
function maintDoneCount(r){ const rc=rec(r.id)||{}; let d=0; (r.maintItems||[]).forEach(it=>{ if(rc.maint&&rc.maint[it]) d++; }); return d; }
function needsMaintenance(r){ return !!(r.maintItems && r.maintItems.length); }
function effKind(r){ const rc=rec(r.id)||{}; return rc.kind||r.kind||(r.type==='سكنية'?'residential':'storage'); }
function altKind(r){ return (r.kind && r.kind!=='residential') ? r.kind : 'storage'; }
function isRes(r){ return effKind(r)==='residential'; }
function selDone(r){ const rc=rec(r.id)||{}; return (isRes(r)?rc.occupancy:rc.svc)?1:0; }
function statusOf(r){ const total=furnTotal(r)+maintTotal(r)+1, done=furnDoneCount(r)+maintDoneCount(r)+selDone(r);
  if(done>=total) return 'complete'; if(done===0) return 'incomplete'; return 'partial'; }

// ---- filters ----
(function(){
  const put=(sel,vals,fmt)=>{ const el=document.getElementById(sel); vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=fmt?fmt(v):v;el.appendChild(o);}); };
  put('f-building',[...new Set(SEED.map(r=>r.building))].sort((a,b)=>a-b),v=>'مبنى '+arNum(v));
  put('f-floor',['G','1','2','3','4'].filter(v=>SEED.some(r=>r.floorLabel===v)),v=>'الدور '+(v==='G'?'G':arNum(v)));
})();
function filtered(){
  const g=id=>document.getElementById(id).value;
  const b=g('f-building'),fl=g('f-floor');
  return SEED.filter(r=>{
    if(b&&String(r.building)!==b)return false;
    if(fl&&String(r.floorLabel)!==fl)return false;
    const rc=rec(r.id); if(rc&&rc.savedAt) return false;
    return true;
  });
}
function stateBadge(r){ const s=statusOf(r),t=furnTotal(r)+maintTotal(r)+1,d=furnDoneCount(r)+maintDoneCount(r)+selDone(r);
  if(s==='complete') return '<span class="state ready">مكتملة</span>';
  if(s==='partial') return `<span class="state partial">جزئيًا · ${arNum(d)}/${arNum(t)}</span>`;
  return `<span class="state notready">غير مكتملة · ${arNum(d)}/${arNum(t)}</span>`; }

function taskSection(title,items,icons,kind,rc,id){

  const store=rc[kind]||{}, done=items.filter(it=>store[it]).length, all=done===items.length;
  const cells=items.map(it=>{const on=!!store[it];
    return `<div class="task ${on?'done':''}" onclick="toggleTask('${id}','${kind}','${it.replace(/'/g,"\\'")}')"><span class="box">${on?'✓':''}</span><span class="ico">${icons[it]||'•'}</span><span class="lbl">${it}</span></div>`;}).join('');
  return `<div class="tasksec"><div class="sechead"><h4>${title}</h4><span class="mini ${all?'all':''}">${arNum(done)}/${arNum(items.length)}</span></div><div class="taskgrid">${cells}</div></div>`;
}
function furnSection(r,rc){
  const items=r.furnItems||[];
  if(!items.length) return `<div class="tasksec"><div class="sechead"><h4>بنود المفروشات</h4></div><div class="none-req">لا يوجد بند مفروشات لهذه الغرفة.</div></div>`;
  const store=rc.furn||{}, done=items.filter(it=>store[it]).length, all=done===items.length;
  const cells=items.map(it=>{const on=!!store[it];
    return `<div class="task ${on?'done':''}" onclick="toggleFurn('${r.id}','${it.replace(/'/g,"\\'")}')"><span class="box">${on?'✓':''}</span><span class="ico">${FURN_ICON[it]||'•'}</span><span class="lbl">${it}</span></div>`;}).join('');
  return `<div class="tasksec"><div class="sechead"><h4>بنود المفروشات</h4><span class="mini ${all?'all':''}">${arNum(done)}/${arNum(items.length)}</span></div><div class="taskgrid">${cells}</div></div>`;
}
function maintInfo(r){
  const items=r.maintItems||[];
  if(!items.length) return '';
  const chips=items.map(it=>`<span class="mchip">${MAINT_ICON[it]||'•'} ${it}</span>`).join('');
  return `<div class="tasksec maint-info"><div class="sechead"><h4>صيانة مطلوبة</h4><span class="mini info">خارج مهمة اليوم</span></div><div class="mchips">${chips}</div><div class="maint-note">تُعالَج ضمن أعمال الصيانة لاحقًا — تبقى الغرفة «مكتملة جزئيًا» حتى تُنجز.</div></div>`;
}
function occLabel(v){return v==='student'?'طالب':v==='worker'?'عامل':v==='empty'?'فارغة':'';}
function occupancyUI(r,rc){
  const cur=rc.occupancy||'';
  const opt=(v,l,ic)=>`<button type="button" class="occ-btn ${cur===v?'on':''}" onclick="setOccupancy('${r.id}','${v}')">${ic} ${l}</button>`;
  return `<div class="tasksec"><div class="sechead"><h4>إشغال الغرفة</h4></div><div class="occ-row">${opt('student','طالب','🎓')}${opt('worker','عامل','👷')}${opt('empty','فارغة','⬜')}</div></div>`;
}
function setOccupancy(id,val){const r=saved[id]||(saved[id]={});r._open=true;r.occupancy=(r.occupancy===val?'':val);markChanged(r);persist();render();enqueue(id);scheduleFlush();}
function svcUI(r,rc){
  const cur=rc.svc||'';
  const opt=(v,l,ic)=>`<button type="button" class="occ-btn ${cur===v?'on':''}" onclick="setSvc('${r.id}','${v}')">${ic} ${l}</button>`;
  return `<div class="tasksec"><div class="sechead"><h4>حالة الغرفة</h4></div><div class="occ-row">${opt('ready','جاهزة','✅')}${opt('notready','تحتاج تجهيز','🛠️')}</div></div>`;
}
function setSvc(id,val){const r=saved[id]||(saved[id]={});r._open=true;r.svc=(r.svc===val?'':val);markChanged(r);persist();render();enqueue(id);scheduleFlush();}
function kindUI(r,rc){ const cur=effKind(r), alt=altKind(r);
  const opt=(v,ic)=>`<button type="button" class="occ-btn ${cur===v?'on':''}" onclick="setKind('${r.id}','${v}')">${ic} ${KINDLBL[v]||v}</button>`;
  return `<div class="tasksec"><div class="sechead"><h4>نوع الغرفة</h4></div><div class="occ-row">${opt('residential','🏠')}${opt(alt,'📦')}</div></div>`; }
function setKind(id,val){const r=saved[id]||(saved[id]={});r._open=true;r.kind=val; if(val!=='residential')r.occupancy=''; else r.svc=''; markChanged(r);persist();render();enqueue(id);scheduleFlush();}
function cardHTML(r){
  const rc=rec(r.id)||{}, open=rc._open?'open':'';
  return `<div class="card ${open}" data-id="${r.id}">
    <div class="top" onclick="toggleCard('${r.id}')">
      <span class="chip-code">${r.code}</span>
      <div class="meta"><div class="line1">${KINDLBL[effKind(r)]||r.type}</div>
      <div class="line2">المبنى ${arNum(r.building)} · الدور ${r.floorLabel==='G'?'G':arNum(r.floorLabel)} · الجزء ${arNum(r.section)} · الغرفة ${arNum(r.roomno)}</div></div>
      ${rc.synced?'<span class="synced">✓</span>':''}
      ${stateBadge(r)}<span class="caret">▾</span>
    </div>
    <div class="detail">
      ${kindUI(r,rc)}
      ${(furnTotal(r)+maintTotal(r))===0
        ? (isRes(r)
            ? `<div class="reasonbox ${rc.occupancy?'ready':'await'}">${rc.occupancy?'✅ الغرفة مكتملة — تم تسجيل الإشغال.':'⬜ الغرفة جاهزة — سجّل الإشغال لاعتبارها مكتملة.'}</div>${occupancyUI(r,rc)}`
            : `<div class="reasonbox ${rc.svc?'ready':'await'}">${rc.svc?'✅ تم تسجيل حالة الغرفة.':('⬜ حدّد حالة هذه الغرفة ('+r.type+').')}</div>${svcUI(r,rc)}`)
        : `<div class="reasonbox">سبب عدم الاكتمال: <b>${r.reason||'—'}</b></div>${isRes(r)?occupancyUI(r,rc):svcUI(r,rc)}<p class="hint">أشّر البنود المنجزة (مفروشات وصيانة) ${isRes(r)?'وسجّل الإشغال':'وحدّد الحالة'}. تُعتبر الغرفة «مكتملة» عند إنجاز جميع البنود.</p>${(r.furnItems&&r.furnItems.length)?furnSection(r,rc):''}${(r.maintItems&&r.maintItems.length)?taskSection('صيانة مطلوبة', r.maintItems||[], MAINT_ICON, 'maint', rc, r.id):''}`}
      <div class="field"><label>ملاحظات (اختياري)</label><textarea onchange="setField('${r.id}','notes',this.value)" placeholder="ما المتبقي أو أي ملاحظة...">${rc.notes||''}</textarea></div>
      <div class="field"><label>اسم المراجِع</label><input type="text" onchange="setField('${r.id}','checker',this.value)" value="${rc.checker||REVIEWER}"></div>
      <div class="saverow"><button class="btn primary" onclick="saveRoom('${r.id}')">حفظ</button>
        ${rc.savedAt?`<span class="saved-tag">✓ ${new Date(rc.savedAt).toLocaleString('ar-SA')}</span>`:''}
      </div>
    </div></div>`;
}
function render(){
  const rows=filtered();
  const allHandled=SEED.some(r=>{const rc=rec(r.id);return rc&&rc.savedAt;});
  const emptyMsg=allHandled?'تم حفظ جميع الغرف ✓':'لا توجد غرف مطابقة للتصفية.';
  document.getElementById('list').innerHTML=rows.length?rows.map(cardHTML).join(''):'<div class="empty-list">'+emptyMsg+'</div>';
  updateMetrics();
}
function updateMetrics(){
  const total=SEED.length; let comp=0,part=0,inc=0;
  SEED.forEach(r=>{ const s=statusOf(r); if(s==='complete')comp++; else if(s==='partial')part++; else inc++; });
  document.getElementById('m-total').textContent=arNum(total);
  document.getElementById('m-complete').textContent=arNum(comp);
  document.getElementById('m-partial').textContent=arNum(part);
  document.getElementById('m-incomplete').textContent=arNum(inc);
  const pct=total?Math.round(comp/total*100):0;
  document.getElementById('p-fill').style.width=pct+'%';
  document.getElementById('p-lbl').textContent=arNum(pct)+'% من غرفك مكتملة ('+arNum(comp)+' من '+arNum(total)+')';
}
function toggleCard(id){const r=saved[id]||(saved[id]={});r._open=!r._open;persist();render();}
function markChanged(r){ r.synced=false; }
function toggleTask(id,kind,item){const r=saved[id]||(saved[id]={});r._open=true;const s=r[kind]||(r[kind]={});s[item]=!s[item];markChanged(r);persist();render();enqueue(id);scheduleFlush();}
function toggleFurn(id,item){const r=saved[id]||(saved[id]={});r._open=true;const s=r.furn||(r.furn={});s[item]=!s[item];markChanged(r);persist();render();enqueue(id);scheduleFlush();}
function setField(id,key,val){const r=saved[id]||(saved[id]={});r[key]=val;markChanged(r);persist();enqueue(id);scheduleFlush();}

function roomById(id){return SEED.find(x=>x.id===id);}
function payload(id){
  const r=roomById(id), rc=rec(id)||{};
  const md=(r.maintItems||[]).filter(it=>rc.maint&&rc.maint[it]);
  const fd=(r.furnItems||[]).filter(it=>rc.furn&&rc.furn[it]);
  const _st=statusOf(r);
  const _rr=(!isRes(r)&&rc.svc==='notready')?'غير مكتملة':(_st==='complete'?'مكتملة':(_st==='partial'?'مكتملة جزئيًا':'غير مكتملة'));
  return {reviewer:REVIEWER, room_id:id, building:r.building, floor:r.floor, section:r.section, room_code:r.code, type:r.type, kind:effKind(r),
    recheck_result: _rr,
    maintenance_required:(r.maintItems||[]).join('، '), maintenance_done:md.join('، '),
    maintenance_pending:(r.maintItems||[]).filter(x=>!md.includes(x)).join('، '),
    furniture_required:(r.furnItems||[]).join('، '), furniture_done:fd.join('، '),
    furniture_pending:(r.furnItems||[]).filter(x=>!fd.includes(x)).join('، '),
    occupancy:(isRes(r)?(rc.occupancy||''):''), svc:(isRes(r)?'':(rc.svc||'')), notes:rc.notes||'', checker:rc.checker||REVIEWER};
}
function saveRoom(id){ const r=saved[id]||(saved[id]={}); r.savedAt=Date.now(); markChanged(r); persist(); enqueue(id); render(); flush(); const _s=statusOf(roomById(id)); const sv=(_s==='complete'?'مكتملة':_s==='partial'?'مكتملة جزئيًا':'غير مكتملة'); toast(navigator.onLine===false?('تم الحفظ محليًا ('+sv+') — سيُرفع تلقائيًا عند عودة الاتصال'):('تم الحفظ — '+sv)); }
function enqueue(id){ if(!outbox.includes(id)) outbox.push(id); persistOutbox(); updateSyncUI(); }

let flushTimer=null;
function scheduleFlush(){ if(!SHEET_ENDPOINT)return; clearTimeout(flushTimer); flushTimer=setTimeout(flush,2500); }
function updateSyncUI(){
  const led=document.getElementById('sync-led');
  const synced = SHEET_ENDPOINT && outbox.length===0;
  if(led) led.className='led'+(synced?' ok':'');
  const pend=document.getElementById('sync-pending');
  if(pend) pend.textContent = outbox.length ? ('⬆ '+arNum(outbox.length)+' بانتظار الرفع') : '';
}
function manualSync(){ if(!SHEET_ENDPOINT) return; if(outbox.length){ flush(); toast('جارٍ المزامنة'); } }
async function flush(){
  if(!SHEET_ENDPOINT||!outbox.length){updateSyncUI();return;}
  const batch=outbox.slice(), rows=batch.map(payload);
  try{
    await fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',body:JSON.stringify(rows)});
    await confirmSaved(batch);   // read the sheet back; a room leaves the queue ONLY once the sheet shows it
  }catch(e){ updateSyncUI(); }   // offline / unreachable -> keep queued, retry later
}
// JSONP read-back: compares what the sheet stored against what we pushed
function confirmSaved(batch){
  return new Promise(resolve=>{
    const cb='__hc'+Math.random().toString(36).slice(2); let sc;
    const finish=()=>{ try{delete window[cb];}catch(e){} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); updateSyncUI(); resolve(); };
    const timer=setTimeout(finish,12000);
    window[cb]=data=>{ clearTimeout(timer);
      const map={}; (data&&data.rows||[]).forEach(r=>{map[String(r.room_id)]=r;});
      batch.forEach(id=>{ const want=payload(id), got=map[id];
        if(got && String(got.recheck_result||'')===String(want.recheck_result||'') && String(got.occupancy||'')===String(want.occupancy||'')){
          const r=saved[id]; if(r){ r.synced=true; r.confirmed=true; }
          outbox=outbox.filter(x=>x!==id);
        }
      });
      persist();persistOutbox();updateSyncUI();render(); finish();
    };
    sc=document.createElement('script'); sc.onerror=finish;
    sc.src=SHEET_ENDPOINT+(SHEET_ENDPOINT.indexOf('?')<0?'?':'&')+'callback='+cb+'&_='+Date.now();
    document.body.appendChild(sc);
  });
}


// JSONP GET + reconcile with the sheet so already-recorded rooms aren't redone
function jsonpGet(url){ return new Promise(resolve=>{ const cb='__lg'+Math.random().toString(36).slice(2); let sc;
  const done=()=>{ try{delete window[cb];}catch(e){} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); };
  const timer=setTimeout(()=>{done();resolve(null);},12000);
  window[cb]=d=>{ clearTimeout(timer); done(); resolve(d); };
  sc=document.createElement('script'); sc.onerror=()=>{clearTimeout(timer);done();resolve(null);};
  sc.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb+'&_='+Date.now(); document.body.appendChild(sc); }); }
async function loadSheet(){
  if(!SHEET_ENDPOINT) return;
  const data=await jsonpGet(SHEET_ENDPOINT); if(!data||!data.rooms) return;
  const byRID={}; data.rooms.forEach(sr=>{ if(sr.RoomID) byRID[String(sr.RoomID)]=sr; });
  let applied=0;
  SEED.forEach(seed=>{
    const sr=byRID[seed.id]; if(!sr) return;
    const rr=String(sr.RecheckResult||''), occ=sr.Occupancy||'', chk=sr.Checker||'';
    if(!rr && !occ && !chk) return;
    if(outbox.includes(seed.id)) return;
    const rc=saved[seed.id]||(saved[seed.id]={});
    if(rc.savedAt) return;
    if(sr.Kind && sr.Kind!==seed.kind) rc.kind=sr.Kind;
    const resNow=((rc.kind||seed.kind)==='residential');
    if(resNow){ rc.occupancy=occ; rc.svc=''; }
    else { rc.svc=(rr.indexOf('غير')>=0?'notready':(rr.indexOf('مكتمل')>=0?'ready':'')); rc.occupancy=''; }
    const pendF=String(sr.Furnishings||'').split(';').filter(Boolean), pendM=String(sr.Maintenance||'').split(';').filter(Boolean);
    rc.furn=rc.furn||{}; (seed.furnItems||[]).forEach(it=>{ const k=FURN_MAP[it]; rc.furn[it]=!(k&&pendF.includes(k)); });
    rc.maint=rc.maint||{}; (seed.maintItems||[]).forEach(it=>{ const k=MAINT_MAP[it]; rc.maint[it]=!(k&&pendM.includes(k)); });
    rc.checker=chk||rc.checker; if(sr.Notes) rc.notes=sr.Notes;
    rc.synced=true; rc.confirmed=true;
    const complete=(rr.indexOf('غير')<0 && rr.indexOf('جزئ')<0 && rr.indexOf('مكتمل')>=0);
    if(complete) rc.savedAt=Date.now();
    applied++;
  });
  if(applied) persist();
  render();
}
['f-building','f-floor'].forEach(id=>document.getElementById(id).onchange=render);
window.addEventListener('online',()=>{ toast('عاد الاتصال — جارٍ رفع المحفوظ'); flush(); loadSheet(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ flush(); loadSheet(); } });
setInterval(()=>{ if(outbox.length) flush(); }, 20000);
updateSyncUI(); render(); loadSheet(); flush();
</script>
</body>
</html>
